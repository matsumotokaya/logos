<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <!-- Multiply layer: fabric fold shading, clipped to the bag body. -->
  <defs>
    <clipPath id="bag">
      <path d="M400,790 L1200,790 L1252,1772 Q1256,1840 1186,1840 L414,1840 Q344,1840 348,1772 Z"/>
    </clipPath>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc5ad"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ccc2a9"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#c4b99f"/>
    </linearGradient>
    <filter id="fold" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="2000" fill="#ffffff"/>
  <g clip-path="url(#bag)">
    <rect x="340" y="780" width="920" height="1070" fill="url(#sideShade)"/>
    <rect x="340" y="780" width="920" height="1070" fill="url(#bottomShade)"/>
    <!-- vertical fold streaks -->
    <path d="M520,900 C512,1150 528,1450 516,1800" stroke="#d4c9b0" stroke-width="34" fill="none" opacity="0.55" filter="url(#fold)"/>
    <path d="M705,880 C698,1120 712,1420 702,1810" stroke="#dcd2bb" stroke-width="26" fill="none" opacity="0.45" filter="url(#fold)"/>
    <path d="M918,890 C926,1160 910,1480 924,1806" stroke="#d8cdb5" stroke-width="30" fill="none" opacity="0.5" filter="url(#fold)"/>
    <path d="M1105,900 C1112,1180 1098,1500 1114,1800" stroke="#d2c7ae" stroke-width="36" fill="none" opacity="0.55" filter="url(#fold)"/>
  </g>
</svg>
