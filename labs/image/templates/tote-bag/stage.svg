<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000">
  <!-- Stage: natural canvas tote in a bright studio.
       Print surface: tl(560,1010) tr(1050,1010) br(1062,1560) bl(548,1560). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f2ef"/>
      <stop offset="1" stop-color="#e2e0da"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d5cd"/>
      <stop offset="1" stop-color="#cfccc3"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2dac7"/>
      <stop offset="0.16" stop-color="#eee7d6"/>
      <stop offset="0.5" stop-color="#f2ecdc"/>
      <stop offset="0.84" stop-color="#ebe3d1"/>
      <stop offset="1" stop-color="#dcd3bf"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1600" height="2000" fill="url(#wall)"/>
  <rect y="1760" width="1600" height="240" fill="url(#floor)"/>
  <ellipse cx="810" cy="1852" rx="480" ry="44" fill="#000000" opacity="0.20" filter="url(#soft)"/>

  <!-- back handle -->
  <path d="M640,800 C640,560 720,500 800,500 C880,500 960,560 960,800"
        fill="none" stroke="#c9bda2" stroke-width="38"/>

  <!-- bag body -->
  <path d="M400,790 L1200,790 L1252,1772 Q1256,1840 1186,1840 L414,1840 Q344,1840 348,1772 Z"
        fill="url(#canvas)"/>
  <!-- top hem -->
  <path d="M400,790 L1200,790 L1204,862 L396,862 Z" fill="#e6ddc9"/>
  <line x1="398" y1="866" x2="1202" y2="866" stroke="#c9bda2" stroke-width="5" stroke-dasharray="16 12" opacity="0.65"/>

  <!-- front handle -->
  <path d="M600,880 L600,800 C600,530 690,455 800,455 C910,455 1000,530 1000,800 L1000,880"
        fill="none" stroke="#d7cbb0" stroke-width="44"/>
  <path d="M600,880 L600,800 C600,530 690,455 800,455 C910,455 1000,530 1000,880"
        fill="none" stroke="#bfb193" stroke-width="4" opacity="0.5"/>
  <!-- strap stitches -->
  <rect x="576" y="792" width="48" height="96" rx="6" fill="#d2c5a9"/>
  <rect x="976" y="792" width="48" height="96" rx="6" fill="#d2c5a9"/>
</svg>
