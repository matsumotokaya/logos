<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="組子を抽象化したダミーマーク">
  <!-- PLACEHOLDER MARK, not anybody's identity. See docs/demo-assets.md §8.
